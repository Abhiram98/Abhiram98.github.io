{% include base_path %}

<div class="list__item">
  <table style="width:100%; border:none; border-collapse:collapse;">
    <tr>
      <td style="width:20%; vertical-align:top; padding-right:20px; border:none;">
        <strong>{{ post.venue_short }}</strong>
      </td>
      <td style="vertical-align:top; border:none;">
        <h3 class="archive__item-title" itemprop="headline" style="margin-top:0;">
          {% if post.paperurl %}
            <a href="{{ post.paperurl }}">{{ post.title }}</a>
          {% else %}
            <a href="{{ base_path }}{{ post.url }}" rel="permalink">{{ post.title }}</a>
          {% endif %}
        </h3>
        <p class="archive__item-authors" style="margin:5px 0;">
          {{ post.authors | replace: 'Abhiram Bellur', '<strong>Abhiram Bellur</strong>' | replace: 'A Bellur', '<strong>A Bellur</strong>' }}
        </p>
        <p class="archive__item-venue" style="font-size:0.9em; color:#666;">
          {{ post.venue_full }} {% if post.track %}- {{ post.track }}{% endif %}
        </p>
      </td>
    </tr>
  </table>
</div>
